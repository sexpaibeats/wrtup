<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Переход в YouTube...</title>
    <!-- Поддержка нативного закрытия в Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0f;
            --card-bg: rgba(26, 26, 32, 0.85);
            --text-primary: #f5f5f7;
            --text-secondary: #9e9ea7;
            --yt-red: #ff0033;
            --yt-red-glow: rgba(255, 0, 51, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Фоновый размытый постер стрима */
        .backdrop-bg {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background-size: cover;
            background-position: center;
            filter: blur(40px) brightness(0.25);
            opacity: 0;
            transition: opacity 0.6s ease;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 340px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 28px 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .preview-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 14px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .yt-icon-center {
            position: absolute;
            width: 48px;
            height: 48px;
            fill: var(--yt-red);
            filter: drop-shadow(0 4px 14px var(--yt-red-glow));
            z-index: 2;
            transition: transform 0.2s ease;
        }

        .spinner-ring {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--yt-red);
            border-radius: 50%;
            animation: spin 0.85s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
            z-index: 3;
        }

        h2 {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: -0.2px;
        }

        p {
            font-size: 13.5px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px 16px;
            border-radius: 14px;
            font-size: 14.5px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--yt-red);
            color: #ffffff;
            box-shadow: 0 4px 14px var(--yt-red-glow);
        }

        .btn-primary:active {
            transform: scale(0.98);
            filter: brightness(0.9);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .btn-secondary:active {
            background-color: rgba(255, 255, 255, 0.14);
            transform: scale(0.98);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="backdrop-bg" id="backdrop"></div>

    <div class="container">
        <div class="preview-box">
            <img class="preview-img" id="preview-img" alt="Обложка видео">
            <div class="spinner-ring" id="spinner"></div>
            <svg class="yt-icon-center" id="yt-logo" viewBox="0 0 24 24">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
        </div>

        <h2 id="title">Открываем YouTube...</h2>
        <p id="desc">Переключаем в приложение трансляции</p>

        <div class="btn-group" id="btn-group">
            <a class="btn btn-primary" id="btn-open-app" href="#">▶️ Открыть в приложении</a>
            <a class="btn btn-secondary" id="btn-open-web" href="#">🌐 Смотреть в браузере</a>
            <button class="btn btn-secondary" id="btn-close" style="display: none;" onclick="closeApp()">✕ Закрыть</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            try {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            } catch (e) {}
        }

        function closeApp() {
            try {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.close) {
                    window.Telegram.WebApp.close();
                    return;
                }
            } catch (e) {}

            try {
                if (window.history.length > 1) {
                    window.history.back();
                    return;
                }
            } catch (e) {}

            try {
                window.opener = null;
                window.open('', '_self');
                window.close();
            } catch (e) {}
        }

        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('v') || urlParams.get('video') || urlParams.get('id');
            const timeCode = urlParams.get('t') || urlParams.get('time');

            if (!videoId) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('title').innerText = 'Видео не найдено';
                document.getElementById('desc').innerText = 'Параметр ?v=ID_ВИДЕО не передан в ссылке.';
                document.getElementById('btn-group').style.display = 'none';
                return;
            }

            const timeParam = timeCode ? `&t=${encodeURIComponent(timeCode)}` : '';
            const webUrl = `https://www.youtube.com/watch?v=${videoId}${timeParam}`;
            const iosDeepLink = `youtube://watch?v=${videoId}${timeParam}`;
            const androidIntent = `intent://www.youtube.com/watch?v=${videoId}${timeParam}#Intent;package=com.google.android.youtube;scheme=https;S.browser_fallback_url=${encodeURIComponent(webUrl)};end`;

            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            const isAndroid = /Android/.test(navigator.userAgent);
            const isDesktop = !isIOS && !isAndroid;

            // Загрузка обложки стрима
            const thumbUrl = `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
            const imgEl = document.getElementById('preview-img');
            const bgEl = document.getElementById('backdrop');

            imgEl.src = thumbUrl;
            imgEl.onload = function() {
                imgEl.style.display = 'block';
                bgEl.style.backgroundImage = `url('${thumbUrl}')`;
                bgEl.style.opacity = '1';
            };

            const btnApp = document.getElementById('btn-open-app');
            const btnWeb = document.getElementById('btn-open-web');
            const btnClose = document.getElementById('btn-close');

            btnWeb.href = webUrl;
            btnApp.href = isIOS ? iosDeepLink : (isAndroid ? androidIntent : webUrl);

            // Обработка перехода
            if (isDesktop) {
                // На ПК сразу открываем веб-версию
                window.location.replace(webUrl);
                return;
            }

            // Мобильные устройства: запуск диплинка
            if (isAndroid) {
                window.location.href = androidIntent;
            } else if (isIOS) {
                window.location.href = iosDeepLink;
            }

            // Когда пользователь возвращается обратно из приложения YouTube:
            function handleReturn() {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('title').innerText = 'Трансляция открыта';
                document.getElementById('desc').innerText = 'Если приложение не запустилось автоматически, выберите действие:';
                btnClose.style.display = 'flex';
            }

            window.addEventListener('pagehide', handleReturn);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    handleReturn();
                }
            });

            // Мягкий таймер на случай задержки
            setTimeout(handleReturn, 1500);
        })();
    </script>
</body>
</html>
